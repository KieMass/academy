name: CI

# Lint, typecheck and the Vitest unit suite — all of which run against a
# fully mocked db (see tests/unit/mocks/prisma.ts) and need no database
# connection at all, so this job has no DATABASE_URL/secrets dependency.
#
# Playwright e2e (tests/e2e/) is deliberately NOT run here yet: it needs a
# real running app + a seeded database (npm run db:seed creates demo
# accounts), and right now the only DATABASE_URL that exists is the live
# production one — this repo doesn't yet have a separate dev/CI database.
# Wiring e2e into CI is the natural follow-on once that split exists.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (used by the Vitest suite) requires Node >=22.22 —
          # see its package.json "engines". Node 20 fails at runtime with
          # a cryptic "webidl.util.markAsUncloneable is not a function".
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
